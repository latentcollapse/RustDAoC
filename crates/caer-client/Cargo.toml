[package]
name = "caer-client"
description = "Headless DAoC client: drives the real server through login->character-select using caer-protocol. The P1 proof that our Rust protocol stack can BE the client, not just read it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
log = "0.4"
caer-protocol = { path = "../caer-protocol" }
# Examples (spell_rt) apply ServerEvent into WorldState for cast-bar / particle binding.
caer-world = { path = "../caer-world" }

[lib]
name = "caer_client"
path = "src/lib.rs"

[[bin]]
name = "caer-client"
path = "src/main.rs"
